<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Czas pracy · TEST</title>
  <meta name="theme-color" content="#f4f6f5">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="top" id="top">
    <button class="iconBtn" data-a="prev-month" type="button" aria-label="Poprzedni miesiąc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>
    <button class="monthTitle" id="monthTitle" data-a="pick-month" type="button">—</button>
    <button class="iconBtn" data-a="next-month" type="button" aria-label="Następny miesiąc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.59 16.59 10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg></button>
    <span class="spacer"></span>
    <button class="todayBtn" id="todayBtn" data-a="go-today" type="button" hidden>Dziś</button>
    <span class="testBadge" title="Wersja testowa">TEST</span>
    <button class="iconBtn" data-a="menu" type="button" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg></button>
    <input type="month" id="monthPicker" aria-label="Wybierz miesiąc" style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px">
  </header>

  <main id="main">
    <div id="summary"></div>
    <div id="banner"></div>
    <div id="list"></div>
  </main>

  <dialog class="sheet" id="sheet" aria-label="Szczegóły"></dialog>
  <dialog class="panel" id="panel" aria-label="Panel"></dialog>
  <dialog class="confirm" id="confirm" aria-labelledby="confirmTitle">
    <h3 id="confirmTitle"></h3>
    <p id="confirmMsg"></p>
    <div class="confirmActs" id="confirmActs"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span><button id="toastUndo" type="button" hidden>Cofnij</button></div>
  <input type="file" id="fileInput" accept="application/json,.json,text/plain,.txt" hidden>
  <noscript>Ta aplikacja wymaga włączonej obsługi JavaScript.</noscript>
</body>
</html>
